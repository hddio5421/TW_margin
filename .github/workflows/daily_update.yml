name: Daily TWSE & TPEx Market Margin Auto Update

on:
  schedule:
    # 台灣時間每個股市交易日晚間 21:45 (UTC 13:45) 自動執行對接抓取
    - cron: '45 13 * * 1-5'
  workflow_dispatch: # 支援在 GitHub Actions 頁面上點擊按鈕一鍵手動執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run daily data fetcher
        run: |
          python fetch_real_data.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ daily_market_breadth.csv data_fallback.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 每日盤後數據自動對接更新 [$(date +'%Y-%m-%d')]" && git push)
